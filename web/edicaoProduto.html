<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Anúncio - OLX Cópia</title>

    <!-- Carrega o Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Carrega a fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        /* Estilos customizados adicionais */
            body {
                font-family: 'Inter', sans-serif;
                background-color: #f5f5f5; /* Fundo cinza claro */
            }
            
            /* Ajuste para os ícones no header */
            .header-icon {
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 0.75rem; /* 12px */
                color: #4a4a4a;
            }
            .header-icon svg {
                width: 24px;
                height: 24px;
                margin-bottom: 4px;
            }

        </style>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

    <!-- HEADER (Copiado do index.html para consistência) -->
    <header class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto">
            <!-- Linha Superior do Header -->
            <div class="flex items-center justify-between space-x-4">

                <!-- Logo -->
                <div class="logo">
                    <!-- Caminho final que funcionou para o logo -->
                    <img src="/static/logo.png" alt="Logo" class="h-10 w-auto">
                </div>

                <!-- Barra de Busca -->
                <div class="flex-grow flex items-center border border-gray-300 rounded-md overflow-hidden max-w-xl">
                    <span class="pl-3 text-gray-500">
                        <!-- Ícone de Lupa (SVG) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="search" placeholder="Buscar" class="p-3 w-full focus:outline-none">
                    <button class="bg-gray-100 p-3 h-full border-l border-gray-300">
                        <span class="text-gray-600 font-semibold text-sm flex items-center">
                            <!-- Ícone de Localização (SVG) -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            PE
                            <!-- Ícone de Chevron (SVG) -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                            </svg>
                        </span>
                    </button>
                </div>

                <!-- Links da Direita -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="#" class="header-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                        <span>Plano Profissional</span>
                    </a>
                    <a href="#" class="header-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16 4v12l-4-2-4 2V4M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span>Meus Anúncios</span>
                    </a>
                    <a href="#" class="header-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <span>Chat</span>
                    </a>
                    <a href="#" class="header-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span>Notificações</span>
                    </a>
                </div>

                <!-- Botões -->
                <div class="flex items-center space-x-3">
                    <button class="font-semibold text-purple-700 px-4 py-2 rounded-full hover:bg-purple-100">
                        Entrar
                    </button>
                    <button
                        class="bg-orange-500 text-white font-semibold px-6 py-3 rounded-full hover:bg-orange-600 shadow-lg">
                        Anunciar grátis
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow container mx-auto p-4 lg:p-8 flex justify-center items-start">
        <div class="bg-white rounded-lg shadow-md p-6 lg:p-8 w-full max-w-2xl">
            <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Edite sua Oferta</h1>

            <!-- Status do Anúncio (Exemplo) -->
            <div class="flex items-center justify-between text-sm text-gray-600 mb-8">
                <div class="flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1 text-green-500" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                            clip-rule="evenodd" />
                    </svg>
                    <span>Oferta Ativa</span>
                </div>
                <!-- Simulação de "Ativar Publicação" -->
                <label for="ativarPublicacao" class="flex items-center cursor-pointer">
                    <input type="checkbox" id="ativarPublicacao" class="sr-only peer" checked>
                    <div
                        class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-purple-600">
                    </div>
                    <span class="ml-2 text-sm text-gray-700">Ativar Publicação</span>
                </label>
            </div>

            <!-- 
                    Formulário adaptado para o CRUD do "Circular Food Connect"
                    Campos: titulo, descricao, quantidade, valor_de_venda, localizacao
                -->
            <form class="space-y-6">

                <!-- Campo Título -->
                <form class="space-y-6">

                    <!-- Campo Título -->
                    <div>
                        <label for="titulo" class="text-sm font-medium text-gray-700 mb-1 block">Título da Oferta
                            *</label>
                        <input type="text" id="titulo"
                            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500"
                            value="Laranja">
                        <p class="text-xs text-gray-500 mt-1 text-right">0/60</p>
                    </div>

                    <!-- Campo Descrição -->
                    <div>
                        <label for="descricao" class="text-sm font-medium text-gray-700 mb-1 block">Descrição *</label>
                        <textarea id="descricao" rows="5"
                            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500">laranja ressecada</textarea>
                        <p class="text-xs text-gray-500 mt-1 text-right">0/2000</p>
                    </div>

                    <!-- Campo Quantidade -->
                    <div>
                        <label for="quantidade" class="text-sm font-medium text-gray-700 mb-1 block">Quantidade (em Kg)
                            *</label>
                        <input type="number" id="quantidade"
                            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500"
                            value="50.0">
                    </div>

                    <!-- Campo Valor de Venda -->
                    <div>
                        <label for="valor_de_venda" class="text-sm font-medium text-gray-700 mb-1 block">Valor de Venda
                            (R$) *</label>
                        <input type="text" id="valor_de_venda"
                            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500"
                            value="50.00">
                    </div>

                    <!-- Campo Localização (Cidade) -->
                    <div>
                        <label for="localizacao" class="text-sm font-medium text-gray-700 mb-1 block">Localização
                            (Cidade) *</label>
                        <input type="text" id="localizacao"
                            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500"
                            value="Recife">
                    </div>

                    <!-- Ações do Formulário -->
                    <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                        <a href="#" class="text-sm text-gray-600 hover:text-red-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2A9 9 0 111 12a9 9 0 0118 0z" />
                            </svg>
                            Remover Oferta
                        </a>
                    </div>

                    <!-- Seção de Fotos (Mantida da OLX) -->
                    <div class="pt-6 border-t border-gray-200">
                        <p class="text-sm font-medium text-gray-700 mb-1 block mb-2">Fotos</p>
                        <p class="text-sm text-gray-600 mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-1 text-purple-600"
                                viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-4 3 3 5-5V15z"
                                    clip-rule="evenodd" />
                            </svg>
                            Arraste as fotos para cá ou clique aqui para selecionar.
                            <span class="block text-xs text-gray-500">Mínimo 1, máximo 6 fotos.</span>
                        </p>
                        <div
                            class="border-2 border-dashed border-gray-300 rounded-md p-6 text-center text-gray-500 cursor-pointer hover:border-purple-500 hover:text-purple-600 transition-colors duration-200">
                            Clique ou arraste fotos aqui
                        </div>

                        <!-- Fotos de Exemplo -->
                        <div class="mt-4 grid grid-cols-3 gap-4">
                            <div class="relative">
                                <img src="https://placehold.co/100x100/f97316/ffffff?text=Laranja+1"
                                    alt="[Imagem de Foto 1]" class="rounded-md w-full h-auto">
                                <button
                                    class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 text-xs">X</button>
                            </div>
                            <div class="relative">
                                <img src="https://placehold.co/100x100/fb923c/ffffff?text=Laranja+2"
                                    alt="[Imagem de Foto 2]" class="rounded-md w-full h-auto">
                                <button
                                    class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 text-xs">X</button>
                            </div>
                            <div
                                class="relative border-2 border-dashed border-gray-300 rounded-md flex items-center justify-center text-gray-400 p-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                </svg>
                            </div>
                        </div>
                    </div>

                </form>
        </div>
    </main>

    <!-- Botão Flutuante de Salvar -->
    <footer class="bg-gray-200 py-4 mt-8">
        <div class="container mx-auto text-center text-gray-600 text-sm">
            <!-- Botão Salvar (agora no footer) -->
            <button
                class="bg-purple-600 text-white font-semibold px-8 py-3 rounded-md hover:bg-purple-700 shadow-lg fixed bottom-4 right-4 animate-bounce">
                Salvar Alterações
            </button>
        </div>
    </footer>

</body>

</html>
